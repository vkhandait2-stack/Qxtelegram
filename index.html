<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join our Telegram Channel</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#14213d;--muted:#5b6678;--btn:#229ed9;--btn-t:#fff;--line:#e3e8f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1420;--card:#182033;--text:#eef2f9;--muted:#9aa6bb;--line:#26314a}}
:root[data-theme="dark"]{--bg:#0f1420;--card:#182033;--text:#eef2f9;--muted:#9aa6bb;--line:#26314a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 22px;text-align:center}
.icon{width:72px;height:72px;border-radius:50%;background:var(--btn);margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--muted);line-height:1.5;margin:0 0 20px;font-size:15px}
.btn{display:block;background:var(--btn);color:var(--btn-t);text-decoration:none;font-weight:600;font-size:17px;padding:15px;border-radius:14px}
.btn:active{opacity:.85}
small{display:block;margin-top:18px;color:var(--muted);font-size:11.5px;line-height:1.4}
</style>
</head>
<body>
<div class="card">
  <div class="icon"><svg width="38" height="38" viewBox="0 0 24 24" fill="#fff"><path d="M21.9 4.2 18.7 19.4c-.2 1-.9 1.3-1.7.8l-4.700-3.500-2.300 2.200c-.3.300-.5.500-1 .5l.3-4.800 8.700-7.900c.4-.3-.1-.5-.6-.2L6.700 13.300 2.100 11.900c-1-.3-1-1 .2-1.500L20.300 3.400c.8-.3 1.600.2 1.600.8z"/></svg></div>
  <h1>Join our Telegram Channel</h1>
  <p>Quotex trading bot updates, tutorials aur access details ke liye Telegram channel join karein.</p>
  <a class="btn" id="join" href="https://telegram.me/QUOTEXREMIXAI">Open Telegram &amp; Join</a>
  <small>Trading involves high risk and you can lose your capital. No profits are guaranteed. This is not financial advice.</small>
</div>
</body>
</html>
